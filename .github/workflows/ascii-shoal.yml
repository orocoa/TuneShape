name: ASCII Shoal
on:
  push:
    paths:
      - 'examples/ascii-shoal/**'
      - '.github/workflows/ascii-shoal.yml'
  pull_request:
    paths:
      - 'examples/ascii-shoal/**'
      - '.github/workflows/ascii-shoal.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ascii-shoal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test test/*.test.mjs
      - run: npm run build
